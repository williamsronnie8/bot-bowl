name: Run the league

# Every day: score any finished week, let the bots make their moves once a new
# week starts, rebuild the page. Safe to run any number of times.
on:
  schedule:
    - cron: "17 15 * * *"   # 15:17 UTC daily (late morning in the US)
  workflow_dispatch:         # "Run workflow" button for a manual run

permissions:
  contents: write

concurrency:
  group: league
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Play
        run: python3 league.py
      - name: Build page
        run: python3 site.py
      - name: Save
        run: |
          git config user.name "bot-bowl"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "League update $(date -u +%F)"
          git push
